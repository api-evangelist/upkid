name: Upkid
description: Upkid is a childcare staffing marketplace that connects early childhood programs
  such as daycares and preschools with qualified, pre-vetted substitute and full-time teachers.
  Programs post shifts and roles while educators find flexible teaching opportunities through
  the Upkid web and mobile apps, with an ATS-style Hiring Hub for full-time childcare hiring.
  Upkid operates across metro areas in Georgia, Utah, and Arizona and is a Techstars portfolio
  company. Upkid publishes no public API or developer portal; its web app is a client of a
  Firebase backend.
